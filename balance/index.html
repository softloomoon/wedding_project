<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신혼생활 밸런스 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column; the only loud element is the two-colour VS pair. */
:root {
  --bg: #f8efe2;
  --surface: #fffaf2;
  --ink: #3a2430;
  --muted: #9a7d83;
  --line: #ecd9ce;
  --acc: #a3265c;
  --acc-ink: #ffffff;
  --a: #c23b5a;
  --a-soft: #fbe0e6;
  --b: #5b6fa0;
  --b-soft: #e4e8f5;
  --display: "Gaegu", cursive;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  word-break: keep-all;
}
#app {
  max-width: 640px;
  margin: 0 auto;
  padding: 32px 20px 56px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 700; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(2.4rem, 9vw, 3.6rem); }
h1 .a { color: var(--a); }
h1 .b { color: var(--b); }
h2 { font-size: clamp(1.8rem, 7vw, 2.6rem); }
h3 { font-size: 1rem; font-weight: 600; }
.eyebrow { font-size: .875rem; font-weight: 600; color: var(--muted); }
.lead { font-size: 1.0625rem; color: var(--muted); max-width: 34em; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--acc);
  outline-offset: 2px;
}
.btn {
  border: none;
  background: var(--acc);
  color: var(--acc-ink);
  padding: 12px 20px;
  border-radius: 999px;
  font-weight: 700;
  box-shadow: 0 10px 20px -10px rgba(163, 38, 92, .6);
}
.btn.ghost { background: transparent; color: var(--acc); border: 2px dashed var(--acc); box-shadow: none; }
.btn.small { padding: 8px 14px; font-size: .9375rem; }
.btn.block { display: block; width: 100%; text-align: center; min-height: 48px; }
.btn.block:active { transform: scale(.98); }
.linkbtn { border: 0; background: none; color: var(--muted); padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.btn-outline {
  display: block; width: 100%; text-align: center; min-height: 48px;
  padding: 12px 16px; border: 2px dashed var(--line); border-radius: 999px;
  background: var(--surface); color: var(--acc); font: inherit; font-weight: 700;
  transition: transform .08s ease, border-color .15s ease;
}
.btn-outline:hover { border-color: var(--acc); }
.btn-outline:active { transform: scale(.98); border-color: var(--acc); }

.panel {
  background: var(--surface);
  border: 2px dashed var(--line);
  border-radius: 18px;
  padding: 18px;
}

/* Start screen sample pair and question pair share the VS look */
.versus { display: grid; grid-template-columns: 1fr; gap: 0; position: relative; }
.choice {
  border: 0;
  text-align: left;
  padding: 26px 22px;
  min-height: 132px;
  font-size: 1.1875rem;
  font-weight: 600;
  line-height: 1.45;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  gap: 6px;
  transition: transform .12s ease;
}
.why { font-size: .875rem; font-weight: 500; color: var(--muted); }
.hero { margin: 0; background: var(--surface); border: 2px dashed var(--line); border-radius: 18px; padding: 8px 12px; }
.hero img { display: block; width: 100%; max-width: 340px; height: auto; margin: 0 auto; }
.hero .ink { stroke: var(--ink); } .hero .inkfill { fill: var(--ink); } .hero .skin { fill: var(--surface); }
.hero .sa { stroke: var(--a); } .hero .safill { fill: var(--a-soft); } .hero .sadot { fill: var(--a); }
.hero .sb { stroke: var(--b); } .hero .sbfill { fill: var(--b-soft); } .hero .sbdot { fill: var(--b); }
.choice.left { background: var(--a-soft); border-radius: 18px 18px 0 0; border-bottom: 3px solid var(--a); }
.choice.right { background: var(--b-soft); border-radius: 0 0 18px 18px; border-top: 3px solid var(--b); }
button.choice:hover { transform: scale(1.015); }
button.choice:active { transform: scale(.985); }
.vs {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.25rem;
  background: var(--acc); color: var(--acc-ink);
  width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center;
  pointer-events: none;
}
@media (min-width: 600px) {
  .versus { grid-template-columns: 1fr 1fr; }
  .choice { min-height: 220px; padding: 30px 34px 30px 26px; }
  .choice.left { border-radius: 18px 0 0 18px; border-bottom: 0; border-right: 3px solid var(--a); }
  .choice.right { border-radius: 0 18px 18px 0; border-top: 0; border-left: 3px solid var(--b); padding: 30px 26px 30px 34px; }
}
@media (prefers-reduced-motion: reduce) {
  .choice { transition: none; }
  button.choice:hover, button.choice:active { transform: none; }
}

.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--acc); }
.count { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muted); }
.chip { font-size: .8125rem; font-weight: 700; color: var(--acc); border: 1px dashed var(--acc); border-radius: 999px; padding: 2px 10px; }

.meter { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: .9375rem; font-variant-numeric: tabular-nums; }
.meter .track { height: 10px; border-radius: 5px; background: var(--b); overflow: hidden; }
.meter .track > i { display: block; height: 100%; background: var(--a); }
.meter .la { color: var(--a); font-weight: 600; }
.meter .lb { color: var(--b); font-weight: 600; }

.big { font-family: var(--display); font-weight: 700; color: var(--acc); font-size: clamp(4rem, 20vw, 6.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
dt { font-weight: 600; white-space: nowrap; }
dd { margin: 0; color: var(--muted); }

.code { font-family: var(--display); font-weight: 700; color: var(--acc); font-size: 2rem; letter-spacing: .18em; }
input[type="text"] {
  font: inherit; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  width: 7.5em; padding: 10px 14px;
  border: 2px dashed var(--acc); border-radius: 10px;
  background: var(--surface); color: var(--ink);
}
textarea {
  font: inherit; font-size: .9375rem; width: 100%; resize: none;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink);
}
.note { font-size: .875rem; color: var(--muted); min-height: 1.4em; }
.error { color: var(--a); }

.diff { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.diff li { border-left: 3px solid var(--line); padding-left: 12px; }
.diff .cat { font-size: .8125rem; font-weight: 600; color: var(--muted); }
.diff .me b { color: var(--a); }
.diff .you b { color: var(--b); }
.topics { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
/* Card-style question screen */
.qcard { position: relative; background: var(--surface); border: 2px dashed var(--line); border-radius: 18px; padding: 32px 18px 18px; text-align: center; margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
.qnum { position: absolute; top: -21px; left: 50%; transform: translateX(-50%); width: 42px; height: 42px; border-radius: 50%; background: var(--acc); color: var(--acc-ink); font-family: var(--display); font-weight: 700; font-size: 1.125rem; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.qcard h2 { font-family: var(--body); font-weight: 500; font-size: clamp(1.125rem, 4.8vw, 1.4375rem); line-height: 1.45; }
.qcard h2 b { font-weight: 700; }
.duel { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
.card { position: relative; border: 2px solid; border-radius: 18px; background: #fff; color: var(--ink); padding: 46px 10px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; transition: transform .12s ease; }
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 36px; border-radius: 15px 15px 0 0; }
.card.left { border-color: var(--a); box-shadow: 0 5px 0 var(--a-soft); }
.card.right { border-color: var(--b); box-shadow: 0 5px 0 var(--b-soft); }
.card.left::before { background: var(--a-soft); }
.card.right::before { background: var(--b-soft); }
.letter { position: absolute; top: -20px; left: 50%; font-family: var(--display); font-weight: 700; font-size: 3rem; line-height: 1; }
.left .letter { color: var(--a); transform: translateX(-50%) rotate(-7deg); }
.right .letter { color: var(--b); transform: translateX(-50%) rotate(7deg); }
.icon { width: 68px; height: 68px; flex: none; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.left .icon { stroke: var(--a); }
.right .icon { stroke: var(--b); }
.ctext { margin: auto 0; display: flex; flex-direction: column; gap: 4px; font-size: 1rem; font-weight: 400; line-height: 1.5; }
.ctext b { font-weight: 700; font-size: 1.125rem; }
button.card:hover { transform: translateY(-4px); }
button.card:active { transform: translateY(1px); }
.duel .vs { z-index: 1; top: 37%; border: 3px solid var(--bg); width: 50px; height: 50px; font-size: 1.125rem; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } button.card:hover, button.card:active { transform: none; } }
.art { display: block; width: 100%; max-width: 250px; height: auto; aspect-ratio: 1; border-radius: 12px; background: #fff; }
.type-card{display:block;width:100%;max-width:380px;height:auto;margin:0 auto;border-radius:24px;box-shadow:0 14px 30px -20px rgba(58,36,48,.45)}
.type-mini{display:flex;align-items:center;gap:14px}
.type-mini img{flex:none;width:72px;height:auto;border-radius:12px}
.type-mini .eyebrow{margin:0 0 2px}
</style>

const fmt = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const plain = s => s.replace(/\*\*/g, "");
const TIE = { s: Q.findIndex(q => q.x === "s"), e: Q.findIndex(q => q.x === "e") };
const TYPES = {
  ae: { img: "img/type-ae.png", animal: "강아지", name: "알콩달콩 이벤트형", line: "함께하는 시간도, 표현도 아낌없이", good: "매일이 연애처럼 활기차다", care: "혼자만의 시간이 부족해질 수 있다" },
  ab: { img: "img/type-ab.png", animal: "곰", name: "든든한 단짝형", line: "말은 적어도 늘 곁에 있는 가장 친한 친구", good: "함께하는 일상이 자연스럽고 편하다", care: "마음을 말로 전할 기회를 놓치기 쉽다" },
  ye: { img: "img/type-ye.png", animal: "펭귄", name: "둘만의 로맨스형", line: "각자의 시간은 지키고, 마음은 자주 전한다", good: "거리와 다정함의 균형이 좋다", care: "함께하는 활동이 줄어들 수 있다" },
  yb: { img: "img/type-yb.png", animal: "판다", name: "편안한 동반자형", line: "서로의 공간을 존중하는 잔잔한 사이", good: "간섭 없이 편안하고 안정적이다", care: "서로 무심하다고 느낄 수 있다" }
};
const TIERS = [
  { min: 18, title: "복사 붙여넣기 커플", text: "거의 한 사람이 두 번 풀었어요. 엇갈린 한두 문항이 오히려 궁금해지네요." },
  { min: 13, title: "찰떡궁합 커플", text: "큰 방향이 같아요. 다른 몇 가지만 미리 맞춰 두면 신혼이 한결 편해져요." },
  { min: 7, title: "반반 커플", text: "절반은 통하고 절반은 새로워요. 서로에게 배울 게 가장 많은 구간이에요." },
  { min: 0, title: "정반대 매력 커플", text: "이렇게 다른데 사랑에 빠졌네요. 오늘 저녁 대화 주제는 충분합니다." }
];
const TOPICS = {
  "애정": "내가 가장 사랑받는다고 느끼는 순간은 언제인가요?",
  "시간": "일주일 중 꼭 함께하고 싶은 시간과 혼자이고 싶은 시간은 언제인가요?",
  "가족": "양가 가족, 친구들과는 얼마나 자주 만나면 좋을까요?",
  "대화": "속상할 때 상대가 어떻게 해 주면 가장 힘이 되나요?"
};
const AL = "0123456789abcdefghjkmnpqrstvwxyz";

function encode(ans) {
  let n = 0;
  ans.forEach((v, i) => { if (v === "A") n |= (1 << i); });
  let s = "";
  for (let k = 0; k < 4; k++) s += AL[(n >> (5 * k)) & 31];
  return s;
}
function decode(raw) {
  const s = String(raw || "").trim().toLowerCase().replace(/o/g, "0").replace(/[il]/g, "1").replace(/u/g, "v");
  if (s.length !== 4) return null;
  let n = 0;
  for (let k = 0; k < 4; k++) {
    const v = AL.indexOf(s[k]);
    if (v < 0) return null;
    n |= v << (5 * k);
  }
  return Q.map((_, i) => ((n >> i) & 1) ? "A" : "B");
}
function score(ans) {
  let r = 0, l = 0;
  Q.forEach((q, i) => { if (ans[i] === "A") { if (q.x === "s") r++; else l++; } });
  const social = r > 5 || (r === 5 && ans[TIE.s] === "A");
  const expressive = l > 5 || (l === 5 && ans[TIE.e] === "A");
  return { r, l, key: (social ? "a" : "y") + (expressive ? "e" : "b") };
}
function compare(mine, theirs) {
  const diff = [];
  Q.forEach((q, i) => { if (mine[i] !== theirs[i]) diff.push(i); });
  const same = Q.length - diff.length;
  return { same, pct: Math.round(same / Q.length * 100), diff, tier: TIERS.find(t => same >= t.min) };
}

let S = { screen: "start", idx: 0, answers: [], flips: [], partner: null, fromInvite: false };
const app = document.getElementById("app");

function newFlips() { return Q.map(() => Math.random() < 0.5); }
function go(screen) { S.screen = screen; render(); window.scrollTo(0, 0); }
function begin() { S.idx = 0; S.answers = []; S.flips = newFlips(); go("quiz"); }
function resetAll() {
  S = { screen: "start", idx: 0, answers: [], flips: [], partner: null, fromInvite: false };
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  render();
}
function pick(v) {
  S.answers[S.idx] = v;
  if (S.idx < Q.length - 1) { S.idx++; render(); }
  else go(S.partner ? "couple" : "result");
}
function copyFrom(id, noteId) {
  const el = document.getElementById(id), note = document.getElementById(noteId);
  const done = () => { note.textContent = "복사했어요. 메신저에 붙여 넣어 보내세요."; };
  const fail = () => { el.focus(); el.select(); note.textContent = "자동 복사가 막혀 있어요. 선택된 글을 직접 복사해 주세요."; };
  try { navigator.clipboard.writeText(el.value).then(done, fail); } catch (e) { fail(); }
}

function meter(labelA, labelB, countA) {
  const pct = countA * 10;
  return `<div class="meter"><span class="la">${labelA} ${pct}%</span><span class="track"><i style="width:${pct}%"></i></span><span class="lb">${labelB} ${100 - pct}%</span></div>`;
}

function viewStart() {
  const invited = !!S.partner;
  return `
  <header class="stack">
    <p class="eyebrow">예비부부를 위한 20문항 · 약 2분</p>
    <h1>신혼생활<br><span class="a">밸런스</span> <span class="b">게임</span></h1>
    <p class="lead">${invited
      ? "예비 배우자가 먼저 답을 골랐어요. 같은 20문항에 답하면 둘의 일치율과 엇갈린 문항이 나옵니다."
      : "정답은 없어요. 다만 둘의 답이 다를 뿐. 혼자 먼저 고르고, 예비 배우자에게 보내 비교해 보세요."}</p>
  </header>
  <figure class="hero"><img src="img/cover.png" alt="저울 양쪽에 앉은 신부와 신랑 그림" width="640" height="640"></figure>
  <div class="row">
    <button class="btn" id="startBtn">${invited ? "나도 골라 보기" : "게임 시작하기"}</button>
    ${invited ? `<button class="linkbtn" id="dropInvite">초대 없이 혼자 하기</button>` : ""}
  </div>
  ${invited ? "" : `
  <form class="panel stack" id="codeForm">
    <h3><label for="codeInput">초대 코드를 받았나요?</label></h3>
    <div class="row">
      <input type="text" id="codeInput" maxlength="4" autocomplete="off" placeholder="예: 7K2M">
      <button class="btn ghost small" type="submit">코드로 시작하기</button>
    </div>
    <p class="note error" id="codeNote" role="status"></p>
  </form>`}`;
}

function viewQuiz() {
  const q = Q[S.idx], flip = S.flips[S.idx];
  const L = flip ? "B" : "A", R = flip ? "A" : "B";
  const card = (v, side, letter) => {
    const why = v === "A" ? q.ra : q.rb, t = v === "A" ? q.a : q.b, ic = ICONS[q.i[v === "A" ? 0 : 1]];
    return `<button class="card ${side}" data-v="${v}"><span class="letter" aria-hidden="true">${letter}</span><img class="art" src="img/q${String(S.idx + 1).padStart(2, "0")}${v === "A" ? "a" : "b"}.png" alt="" width="480" height="480"><span class="ctext">${why ? `<span class="why">${why}</span>` : ""}<span>${fmt(t)}</span></span></button>`;
  };
  return `
  <div class="stack">
    <div class="row" style="justify-content:space-between">
      <span class="chip">${q.c}</span>
      <span class="count">${S.idx + 1} / ${Q.length}</span>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${Q.length}" aria-valuenow="${S.idx}"><i style="width:${S.idx / Q.length * 100}%"></i></div>
  </div>
  <div class="qcard">
    <span class="qnum" aria-hidden="true">${S.idx + 1}</span>
    <h2 id="qTitle" tabindex="-1">${fmt(q.s)}</h2>${q.n ? `
    <p class="why">${q.n}</p>` : ""}
  </div>
  <div class="duel">
    ${card(L, "left", "A")}
    ${card(R, "right", "B")}
    <span class="vs" aria-hidden="true">VS</span>
  </div>
  ${S.idx > 0 ? `<button class="btn-outline" id="backBtn">← 이전 문항으로</button>` : ""}`;
}

function typeBlock(ans, who) {
  const sc = score(ans), t = TYPES[sc.key];
  return `
  <section class="panel stack">
    <div class="type-mini"><img src="${t.img}" alt="" width="800" height="1120"><div><p class="eyebrow">${who}</p>
    <h3 style="font-size:1.25rem">${t.name}</h3></div></div>
    <p>${t.line}</p>
    ${meter("어울림", "여유", sc.r)}
    ${meter("표현", "담백", sc.l)}
    <dl><dt>강점</dt><dd>${t.good}</dd><dt>조심할 점</dt><dd>${t.care}</dd></dl>
  </section>`;
}

function viewResult() {
  const sc = score(S.answers), t = TYPES[sc.key], code = encode(S.answers).toUpperCase();
  const msg = `신혼생활 밸런스 게임 했더니 나는 '${t.name}' 나왔어. 자기는 뭐 고를지 궁금한데, 초대 코드 ${code} 넣고 2분만 해 봐!`;
  return `
  <img class="type-card" src="${t.img}" alt="나의 신혼 스타일 카드: ${t.animal}, ${t.name}" width="800" height="1120">
  <header class="stack">
    <p class="eyebrow">나의 신혼 스타일은</p>
    <h2 id="resTitle" tabindex="-1">${t.name}</h2>
    <p class="lead">${t.line}</p>
  </header>
  <section class="panel stack">
    ${meter("어울림", "여유", sc.r)}
    ${meter("표현", "담백", sc.l)}
    <dl><dt>강점</dt><dd>${t.good}</dd><dt>조심할 점</dt><dd>${t.care}</dd></dl>
  </section>
  <section class="panel stack">
    <h3>예비 배우자와 비교하기</h3>
    <p>상대가 이 코드를 넣고 답하면 일치율이 나옵니다.</p>
    <p class="code" aria-label="초대 코드 ${code.split("").join(" ")}">${code}</p>
    <textarea id="inviteMsg" rows="3" readonly aria-label="초대 메시지">${msg}</textarea>
    <div class="row">
      <button class="btn small" id="copyInvite">초대 메시지 복사하기</button>
      <button class="btn ghost small" id="passBtn">이 기기에서 배우자가 이어서 하기</button>
    </div>
    <p class="note" id="inviteNote" role="status"></p>
  </section>
  <button class="btn block" id="retryBtn">테스트 다시하기</button>`;
}

function viewCouple() {
  const cmp = compare(S.answers, S.partner);
  const cats = [...new Set(cmp.diff.map(i => Q[i].g))];
  const msg = `신혼생활 밸런스 게임 했더니 일치율 ${cmp.pct}%, '${cmp.tier.title}' 나옴. 너희 커플은 몇 % 나올까?`;
  const txt = (i, v) => plain(v === "A" ? Q[i].a : Q[i].b);
  return `
  <header class="stack">
    <p class="eyebrow">우리의 일치율은</p>
    <p class="big">${cmp.pct}%</p>
    <h2 id="resTitle" tabindex="-1">${cmp.tier.title}</h2>
    <p class="lead">20문항 중 ${cmp.same}개가 같았어요. ${cmp.tier.text}</p>
  </header>
  ${typeBlock(S.answers, "나")}
  ${typeBlock(S.partner, "예비 배우자")}
  ${cmp.diff.length ? `
  <section class="panel stack">
    <h3>엇갈린 문항 ${cmp.diff.length}개</h3>
    <ul class="diff">
      ${cmp.diff.map(i => `<li><div class="cat">${Q[i].c} · ${plain(Q[i].s)}</div><div class="me"><b>나</b> ${txt(i, S.answers[i])}</div><div class="you"><b>상대</b> ${txt(i, S.partner[i])}</div></li>`).join("")}
    </ul>
  </section>
  <section class="panel stack">
    <h3>오늘 나눠 볼 이야기</h3>
    <ul class="topics">${cats.map(c => `<li>${TOPICS[c]}</li>`).join("")}</ul>
  </section>` : ""}
  <section class="panel stack">
    <h3>결과 자랑하기</h3>
    <textarea id="shareMsg" rows="3" readonly aria-label="공유 메시지">${msg}</textarea>
    <div class="row"><button class="btn small" id="copyShare">공유 메시지 복사하기</button></div>
    <p class="note" id="shareNote" role="status"></p>
  </section>
  <button class="btn block" id="retryBtn">테스트 다시하기</button>`;
}

function render() {
  const views = { start: viewStart, quiz: viewQuiz, result: viewResult, couple: viewCouple };
  app.innerHTML = views[S.screen]();
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); };

  if (S.screen === "start") {
    on("startBtn", begin);
    on("dropInvite", resetAll);
    const form = document.getElementById("codeForm");
    if (form) form.addEventListener("submit", e => {
      e.preventDefault();
      const got = decode(document.getElementById("codeInput").value);
      if (!got) { document.getElementById("codeNote").textContent = "코드를 찾을 수 없어요. 받은 4글자를 다시 확인해 주세요."; return; }
      S.partner = got; S.fromInvite = true; begin();
    });
  }
  if (S.screen === "quiz") {
    if (S.idx < Q.length - 1) ["a", "b"].forEach(k => { new Image().src = `img/q${String(S.idx + 2).padStart(2, "0")}${k}.png`; });
    app.querySelectorAll("button.card").forEach(b => b.addEventListener("click", () => pick(b.dataset.v)));
    on("backBtn", () => { S.idx--; render(); });
  }
  if (S.screen === "result") {
    try { history.replaceState(null, "", "#vs-" + encode(S.answers)); } catch (e) {}
    on("copyInvite", () => copyFrom("inviteMsg", "inviteNote"));
    on("passBtn", () => { S.partner = S.answers.slice(); S.fromInvite = false; go("start"); });
    on("retryBtn", resetAll);
  }
  if (S.screen === "couple") {
    on("copyShare", () => copyFrom("shareMsg", "shareNote"));
    on("retryBtn", resetAll);
  }
}

function start(saved) {
  if (saved && saved.screen) {
    S = saved;
  } else {
    const m = /^#vs-([0-9a-z]{4})$/i.exec(location.hash || "");
    const got = m ? decode(m[1]) : null;
    if (got) { S.partner = got; S.fromInvite = true; }
  }
  render();
}
window.claude?.hot?.snapshot(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
