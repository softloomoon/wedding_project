<html lang="ko">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#f8efe2;--f:#c23b5a;--fbg:#fbe0e6;--m:#5b6fa0;--mbg:#e4e8f5;--o:#8a7a73;--obg:#efe6e0;--card:#fffaf2;--ink:#3a2430;--mute:#9a7d83;--line:#ecd9ce;--acc:#a3265c;--acc-ink:#FFFFFF;--ok:#4a8a5a;--ok-bg:#e3f0e4;--no:#b5651d;--no-bg:#FBEAD8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:620px;margin:0 auto;padding:28px 20px 64px}
h1{font-family:"Gaegu",cursive;font-size:2.1rem;line-height:1.3;font-weight:700;margin:8px 0 12px;word-break:keep-all}
h2{font-family:"Gaegu",cursive;font-size:1.4rem;font-weight:700;margin:0 0 8px;word-break:keep-all}
p{margin:0 0 12px;word-break:keep-all}
.mute{color:var(--mute);font-size:.92rem}
.card{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:20px;margin:16px 0}
button{font:inherit;cursor:pointer;border-radius:999px;border:2px dashed var(--line);background:var(--card);color:var(--ink);padding:12px 16px;min-height:48px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.primary{background:var(--acc);color:var(--acc-ink);border:none;font-weight:700;width:100%;box-shadow:0 10px 20px -10px rgba(163,38,92,0.6)}
.opt{display:block;width:100%;text-align:left;margin:0 0 10px;line-height:1.45}
.opt:hover{border-color:var(--acc)}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc);font-weight:700}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 12px;min-height:48px}
textarea{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 12px;min-height:96px;resize:vertical}
select{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 12px;min-height:48px}
label{display:block}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 20px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.row{display:flex;gap:10px}.row>*{flex:1}
.code{font:700 .8rem/1.5 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em;text-align:center;padding:16px;border:2px dashed var(--acc);border-radius:16px;margin:12px 0;word-break:break-all;background:var(--acc-soft, #f3d6e2)}
.score{font-family:"Gaegu",cursive;font-size:4.5rem;line-height:1;font-weight:700;color:var(--acc);margin:4px 0 18px}
.note-fin{display:inline-block;font-size:.8rem;color:var(--mute);background:var(--obg);padding:5px 12px;border-radius:99px;margin:2px 0 14px}
.cat{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.tag{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.no{background:var(--no-bg);color:var(--no)}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q b{display:block;margin-bottom:6px;word-break:keep-all}
.ans{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.92rem}
.ans span:nth-child(odd){color:var(--mute)}
.talk{margin-top:8px;font-size:.9rem;color:var(--no)}
.err{color:var(--no);font-weight:500;min-height:1.5em}
.hide{display:none!important}
.g-f{color:var(--f)}.g-m{color:var(--m)}.g-o{color:var(--o)}.g-f,.g-m,.g-o{font-weight:700}
.row button.gf.sel{border-color:var(--f);box-shadow:inset 0 0 0 2px var(--f);color:var(--f);background:var(--fbg)}
.row button.gm.sel{border-color:var(--m);box-shadow:inset 0 0 0 2px var(--m);color:var(--m);background:var(--mbg)}
button:active{background:#7e1d49!important;color:#fff!important;border-color:#7e1d49!important}
.tw{overflow-x:auto}.faint{color:var(--mute);opacity:.4}.gh{font-weight:700;color:var(--mute);font-size:.82rem}
.s-ok{color:var(--ok);font-weight:500}
.cmp{font-size:.85rem}.cmp th,.cmp td{padding:8px 6px}.cmp .lab{white-space:normal;min-width:4.5em}.cmp th:nth-child(4),.cmp td:nth-child(4){width:1%;white-space:nowrap}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;word-break:keep-all}
.lab{color:var(--mute);white-space:nowrap}
.c-f{color:var(--f)}.c-m{color:var(--m)}.c-o{color:var(--o)}.c-f,.c-m,.c-o{font-weight:500}
.art{display:flex;justify-content:center;margin:8px 0}.art svg{max-width:320px;width:100%;height:auto}
.tier-img{display:flex;justify-content:center;margin:8px 0}.tier-img img{max-width:320px;width:100%;height:auto;border-radius:16px;display:block}
.hero{width:100%;border-radius:16px;border:6px solid var(--card);outline:1.5px solid var(--line);box-shadow:0 14px 28px -16px rgba(58,36,48,0.35);transform:rotate(-1deg);display:block;margin:4px 0 20px}
.logo{font-family:"Gaegu",cursive;font-weight:700;font-size:1.3rem;letter-spacing:.01em;text-align:left;color:var(--acc);padding-bottom:10px;margin:0 0 18px;border-bottom:3px dashed var(--acc)}
.row button.sel{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc);font-weight:700}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

function regSel(id,label,val){return '<label for="'+id+'">'+label+'</label><select id="'+id+'"><option value="">선택 안 함</option>'+REG.map(function(r){return '<option'+(r===val?' selected':'')+'>'+r+'</option>'}).join("")+'</select>'}
function head(lab){var pct=Math.round(S.i/TOT*100);return '<p class="mute">'+esc(S.name)+'님의 답변 · '+lab+' ('+(S.i+1)+'/'+TOT+')</p><div class="bar"><i style="width:'+pct+'%"></i></div>'}
function nav(){var i=S.i+1;while(i<TOT&&stepSkipped(i))i++;if(i<TOT){S.i=i;go()}else{finish()}}
function finish(){
 if(S.role==="B"){
  if(S.code){
   app.innerHTML='<p class="mute">답변을 저장하는 중이에요…</p>';
   sbUpdateB(S.code,{a:S.mine,x:S.x}).then(function(res){
    if(res.error){app.innerHTML='<h1>저장에 실패했어요</h1><p>인터넷 연결을 확인하고 다시 시도해 주세요.</p><button class="primary" id="rt">다시 시도</button>';document.getElementById("rt").onclick=finish;return}
    result()
   })
  }else result()
 }else share()
}
function go(){var st=STEPS[S.i];if(st.f)form(st.f);else quiz(st.q)}
function back(){var i=S.i-1;while(i>=0&&stepSkipped(i))i--;S.i=i;go()}
function quiz(k){
 var q=Q[k],pl=PL[k];
 app.innerHTML=head(gname(k))+'<h2>'+esc(q[1])+'</h2><div id="o"></div>'+
 (pl?(pl.s?regSel("pr",pl.sl,S.x[pl.s]):'')+(pl.f?'<label for="pt">'+pl.tl+'</label><input id="pt" maxlength="40" placeholder="'+pl.ph+'" value="'+esc(S.x[pl.f])+'">':'')+'<div class="err" id="er"></div><button class="primary" id="nx">다음</button>':'')+
 '<div class="row" style="margin-top:12px"><button id="bk"'+(S.i?'':' class="hide"')+'>이전</button></div>';
 var o=document.getElementById("o");
 function sv(){if(pl.s)S.x[pl.s]=document.getElementById("pr").value;if(pl.f)S.x[pl.f]=document.getElementById("pt").value.trim()}
 q[2].forEach(function(t,j){var b=document.createElement("button");b.className="opt"+(S.mine[k]===j?" sel":"");b.textContent=t;
  b.onclick=function(){S.mine[k]=j;if(pl){[].forEach.call(o.children,function(c,n){c.className="opt"+(n===j?" sel":"")})}else nav()};o.appendChild(b)});
 if(pl)document.getElementById("nx").onclick=function(){if(S.mine[k]===undefined){document.getElementById("er").textContent=pl.err;return}sv();nav()};
 document.getElementById("bk").onclick=function(){if(pl)sv();back()}
}
function form(id){
 var x=S.x,ld=id==="ld",h;
 if(ld)h=head("결혼 계획")+'<h2>서로 사는 곳</h2><div class="card'+'">'+regSel("rc","내가 지금 사는 지역 (선택)",x.rc)+'<p style="margin:14px 0 6px">서로 사는 지역이 멀어서 장거리인가요?</p><div class="row" id="lr"><button data-v="n">아니요</button><button data-v="y">네, 장거리예요</button></div><div id="lb"><p style="margin:14px 0 6px">결혼하면 이동에 대한 내 생각은?</p><div id="lm"></div></div></div>';
 else h=head("돈과 예산")+'<h2>재정 현황</h2><p class="mute">상대에게 그대로 보여요. 대략적으로 적어도 되고, 말하고 싶지 않은 칸은 비워 두세요.</p><div class="card"><label for="m">현재 모은 돈 (만 원)</label><input id="m" type="number" inputmode="numeric" min="0" placeholder="예: 3000" value="'+esc(x.m)+'">'+
  '<p style="margin:8px 0 6px">빚이 있나요?</p><div class="row" id="dr"><button data-v="n">없어요</button><button data-v="y">있어요</button></div>'+
  '<div id="db"><label for="da" style="display:block;margin-top:12px">빚 규모 (만 원)</label><input id="da" type="number" inputmode="numeric" min="0" placeholder="예: 5000" value="'+esc(x.da)+'"><label for="dn">어떤 빚인가요? (학자금, 전세대출 등)</label><input id="dn" maxlength="40" value="'+esc(x.dn)+'"></div></div>';
 app.innerHTML=h+'<div class="err" id="er"></div><div class="row"><button id="bk">이전</button><button class="primary" id="go">다음</button></div>';
 function $(i){return document.getElementById(i)}
 function sync(){
  [["dr","d"],["lr","l"]].forEach(function(p){var r=$(p[0]);if(r)[].forEach.call(r.children,function(b){b.className=b.getAttribute("data-v")===x[p[1]]?"sel":""})});
  var db=$("db");if(db)db.className=x.d==="y"?"":"hide";
  var lb=$("lb");if(lb)lb.className=x.l==="y"?"":"hide";
  var lm=$("lm");if(lm)[].forEach.call(lm.children,function(b,k){b.className="opt"+(x.lm===k?" sel":"")})}
 [["dr","d"],["lr","l"]].forEach(function(p){var r=$(p[0]);if(r)[].forEach.call(r.children,function(b){b.onclick=function(){x[p[1]]=b.getAttribute("data-v");sync()}})});
 if(ld)MV.forEach(function(t,k){var b=document.createElement("button");b.textContent=t;b.onclick=function(){x.lm=k;sync()};$("lm").appendChild(b)});
 sync();
 function read(){if(ld){x.rc=$("rc").value}else{x.m=$("m").value;x.da=$("da").value;x.dn=$("dn").value.trim()}}
 $("bk").onclick=function(){read();if(S.i===0)home();else back()};
 $("go").onclick=function(){read();var e=$("er");
  if(ld){if(!x.l){e.textContent="장거리 여부를 선택해 주세요.";return}if(x.l==="y"&&x.lm<0){e.textContent="이동에 대한 내 생각을 선택해 주세요.";return}}
  else if(!x.d){e.textContent="빚 여부를 선택해 주세요.";return}
  nav()}
}

 var a=S.other.a,b=S.mine,xa=S.other.x,xb=S.x,m=0,tot=0;
 Q.forEach(function(q,i){if(i===17)return;tot++;if(i===16&&a[16]===3&&b[16]===3){if(a[17]===b[17])m++}else if(a[i]===b[i])m++});
 var pct=Math.round(m/tot*100),P=nt(S.pName,xa.g),Me=nt(S.name,xb.g),t=tier(pct),ga=xa.g||"o",gb=xb.g||"o";
 var ma=money(xa),mb=money(xb),tm=(ma.m||0)+(mb.m||0),td=(ma.d||0)+(mb.d||0);
 LR={pct:pct,t:t,pn:S.pName,mn:S.name,ga:ga,gb:gb,g:[]};
 var html='<p class="mute">'+P+' &amp; '+Me+'</p><div class="tier-img"><img src="'+TIER_IMG[tierIdx(pct)]+'" alt="'+esc(t[0])+': '+esc(t[1])+'"></div><div class="score">'+pct+'%</div>'+
 '<p>'+tot+'문항 중 '+m+'개가 같아요 (일치 '+pct+'% · 다름 '+(100-pct)+'%)</p>'+
 '<p class="mute">이 점수는 궁합이 아니라 대화 출발점이에요.</p>'+
 '<p><span class="note-fin">재정·거리 답변은 점수에 포함하지 않아요</span></p>'+
  ''+act(1);
 function rw(l,v1,v2){return '<tr><td class="lab">'+l+'</td><td class="c-'+ga+'">'+cell(v1)+'</td><td class="c-'+gb+'">'+cell(v2)+'</td></tr>'}
 function gh(n){return '<tr><td colspan="3" class="gh">'+n+'</td></tr>'}
 function ex(rs){return '<p class="mute" style="margin:14px 0 4px">입력한 답변</p><div class="tw"><table class="cmp"><thead><tr><th>항목</th><th class="c-'+ga+'">'+P+'</th><th class="c-'+gb+'">'+Me+'</th></tr></thead><tbody>'+rs+'</tbody></table></div>'}
 var EX={"결혼 계획":ex(rw("현재 사는 지역",esc(xa.rc),esc(xb.rc))+rw("장거리 여부",xa.l==="y"?"장거리":"아님",xb.l==="y"?"장거리":"아님")+rw("이동에 대한 생각",xa.l==="y"?MV[xa.lm]:"",xb.l==="y"?MV[xb.lm]:"")+rw("신혼집 희망 지역",esc(pv(xa,PL[12])),esc(pv(xb,PL[12])))+rw("가고 싶은 여행지",esc(pv(xa,PL[10])),esc(pv(xb,PL[10])))),
  "돈과 예산":ex(rw("모은 돈",fm(ma.m),fm(mb.m))+rw("빚",ma.txt,mb.txt)+'<tr><td class="lab">합산</td><td colspan="2">모은 돈 '+fm(tm)+' · 빚 '+fm(td)+' · 차액 '+fm(tm-td)+'</td></tr>'),
  "결혼식 준비":ex(rw("예식 희망 지역",esc(pv(xa,PL[8])),esc(pv(xb,PL[8]))))};
 var finTip='<div class="talk"><b>재정</b>: 금액 자체보다 빚의 성격(상환 계획, 이자)과 앞으로 어떻게 합칠지를 먼저 얘기해 보세요. 입력하지 않은 항목은 0으로 계산했어요.</div>',distTip="";
 if(xa.l==="y"||xb.l==="y"){
  var ta=xa.l==="y"?xa.lm:-1,tb=xb.l==="y"?xb.lm:-1,note;
  if(xa.l!==xb.l)note="한 사람은 장거리라고 답하고 다른 사람은 아니라고 답했어요. 장거리의 기준(거리, 이동 시간)을 먼저 맞춰 보세요.";
  else if(ta===1&&tb===1)note="둘 다 상대가 오길 원해요. 직장, 비용, 가족 등 각자 움직이기 어려운 이유를 구체적으로 나눠 보세요.";
  else if(ta===0&&tb===0)note="둘 다 이동할 수 있어요. 어디로 갈지 기준(직장, 집값, 양가 거리)부터 정해 보세요.";
  else if((ta===0&&tb===1)||(ta===1&&tb===0))note="한쪽은 이동할 수 있고 다른 쪽은 오길 원해서 방향은 맞아요. 시기와 조건만 확인하면 돼요.";
  else note="아직 정해지지 않은 부분이 있어요. 신혼집 후보 지역부터 함께 적어 보세요.";
  var pa=pv(xa,PL[12]),pb=pv(xb,PL[12]);
  if(xa.l==="y"&&xb.l==="y"&&pa&&pa.toLowerCase()===pb.toLowerCase())note="희망 지역이 같아요. "+note;
  distTip='<div class="talk"><b>거리</b>: '+note+'</div>'}
 GR.forEach(function(g){
  var s2=0,gt=0,trs="",tips="";
  g[1].forEach(function(k){if(k===17)return;gt++;if(k===16&&a[16]===3&&b[16]===3){if(a[17]===b[17])s2++}else if(a[k]===b[k])s2++});
  var gp=gt?Math.round(s2/gt*100):0;LR.g.push([g[0],s2,gt,gp]);
  g[1].forEach(function(i){
   if(i===17)return;
   var same=(i===16&&a[16]===3&&b[16]===3)?(a[17]===b[17]):(a[i]===b[i]);
   trs+='<tr><td class="lab">'+SL[i]+'</td><td class="'+(same?'s-ok':'c-'+ga)+'">'+ansTxt(i,a[i])+'</td><td class="'+(same?'s-ok':'c-'+gb)+'">'+ansTxt(i,b[i])+'</td><td><span class="tag '+(same?'ok':'no')+'">'+(same?'같음':'다름')+'</span></td></tr>';
   if(!same)tips+='<div class="talk"><b>'+SL[i]+'</b>: '+esc(Q[i][3])+'</div>'});
  html+='<div class="card"><div class="cat" style="border:0;padding:0 0 8px"><h2 style="margin:0">'+g[0]+'</h2><span class="tag '+(gp>=50?'ok':'no')+'">'+s2+'/'+gt+' 일치 · '+gp+'%</span></div><div class="tw"><table class="cmp"><thead><tr><th>항목</th><th class="c-'+ga+'">'+P+'</th><th class="c-'+gb+'">'+Me+'</th><th></th></tr></thead><tbody>'+trs+'</tbody></table></div>'+(EX[g[0]]||'')+
   (tips?'<p class="mute" style="margin:12px 0 0">대화해 볼 주제</p>'+tips:'')+(g[0]==="돈과 예산"?finTip:'')+(g[0]==="결혼 계획"?distTip:'')+'</div>'});
 html+=act(2)+'<button class="primary" id="rs">다시 해보기</button>';
 app.innerHTML=html;
 [1,2].forEach(function(n){var st=document.getElementById("pvm"+n),pvw=document.getElementById("pv"+n);
 function hint(){st.textContent="아래 사진을 길게 눌러 저장해 주세요."}
 function showPreview(blob){var url=URL.createObjectURL(blob);
  pvw.innerHTML='<img src="'+url+'" alt="결과 사진" style="width:100%;border-radius:18px;margin-top:12px;border:6px solid var(--card);outline:1.5px solid var(--line);box-shadow:0 14px 28px -16px rgba(58,36,48,.35)">';
  return url}
 document.getElementById("sv"+n).onclick=function(){st.textContent="사진을 만드는 중이에요.";
  mkImg().then(function(blob){
   var url=showPreview(blob);
   try{var a=document.createElement("a");a.href=url;a.download="결혼가치관-결과.png";document.body.appendChild(a);a.click();document.body.removeChild(a);
    st.textContent="사진을 저장했어요. 저장되지 않았다면 아래 사진을 길게 눌러 저장해 주세요."}
   catch(e){hint()}
  }).catch(function(){st.textContent="사진을 만들지 못했어요. 다시 시도해 주세요."})};
 document.getElementById("sh"+n).onclick=function(){
  function fb(){var s=sumTxt();try{navigator.clipboard.writeText(s).then(function(){st.textContent="공유 기능을 쓸 수 없어 결과 요약을 복사했어요. 사진으로 저장해서 함께 보내 주세요."},function(){st.textContent="공유 기능을 쓸 수 없어요. 사진으로 저장해서 보내 주세요."})}catch(e){st.textContent="공유 기능을 쓸 수 없어요. 사진으로 저장해서 보내 주세요."}}
  mkImg().then(function(blob){var f=new File([blob],"결혼가치관-결과.png",{type:"image/png"});
   if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:"결혼 가치관 맞춰보기",text:sumTxt()});
   fb()}).catch(function(e){if(!e||e.name!=="AbortError")fb()})};});
 document.getElementById("rs").onclick=home;window.scrollTo(0,0)
}

home();
</script>
