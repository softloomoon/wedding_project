<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웨딩 프로젝트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  /* 레이아웃: 종이 위에 색종이를 오려 붙인 한 장. 왼쪽 정렬 헤드라인 + 오른쪽 그림, 아래로 카테고리 줄 */
  color-scheme: light;
  --paper:#FBFAF4;
  --ink:#151311;
  --ink-soft:#5d5852;
  --red:#EE4B4B;
  --yellow:#F6C417;
  --blue:#1F62C4;
  --green:#1E8A55;
  --pink:#F7B3C8;
  --orange:#F0531C;
  --line:#e4e0d3;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --gutter:clamp(16px,4vw,48px);
  --card-w:clamp(240px,74vw,320px);
  --gap:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;word-break:keep-all;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--gutter)}

/* 상단 */
.top{position:sticky;top:0;z-index:10;background:var(--paper);display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin:0 calc(var(--gutter) * -1);padding:14px var(--gutter) 10px;border-bottom:2px solid var(--ink)}
.nav{margin-left:-16px}
.cat{scroll-margin-top:130px}
.brand{display:flex;align-items:center;gap:8px;font-family:"Barlow Semi Condensed","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:1.75rem;letter-spacing:.01em;text-decoration:none;line-height:1.1}
.brand svg{width:26px;height:26px;flex:none}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav button{background:none;border:2px solid transparent;border-radius:999px;padding:6px 16px;font-family:var(--display);font-size:1.05rem}
.nav button:hover{border-color:var(--ink)}
.nav button[data-soon]{color:var(--ink-soft)}

/* 메인 */
.hero{text-align:center;padding:clamp(36px,7vw,88px) 0 clamp(40px,7vw,88px)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.3rem,6.4vw,4.6rem);line-height:1.18;margin:0;letter-spacing:-.01em}
.hero h1 span{display:block}
.hero h1 .ask{display:inline-block;position:relative;z-index:0}
.hero h1 .ask::before{content:"";position:absolute;left:-.12em;right:-.12em;bottom:.02em;height:.42em;background:var(--pink);border-radius:.3em .5em .35em .45em;z-index:-1;transform:rotate(-1deg)}
.hero p{margin:22px auto 0;max-width:30em;color:var(--ink-soft)}

/* 카테고리 */
.cat{padding:clamp(28px,4vw,48px) 0;border-top:2px solid var(--ink)}
.cat-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.cat-title{display:flex;align-items:center;gap:14px;margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,3.6vw,2.4rem);line-height:1.1}
.cat-no{display:grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.62em}
.cat-sub{margin:6px 0 0;color:var(--ink-soft);font-size:.95rem}
.cat-head.center{justify-content:center;text-align:center}

/* 슬라이드 배너: 가운데 카드 기준으로 왼쪽으로 넘어감 */
.slider-wrap{position:relative;margin:0 calc(var(--gutter) * -1)}
.slider{overflow:hidden;padding:10px 0 14px}
.track{display:flex;gap:var(--gap);will-change:transform}
.card{flex:none;width:var(--card-w);display:flex;flex-direction:column;text-decoration:none;border:2px solid var(--ink);border-radius:22px;overflow:hidden;background:#fff;opacity:.45;transform:scale(.9);transition:transform .6s ease,opacity .6s ease}
.card.is-center{opacity:1;transform:none}
.card.is-center:hover{transform:translateY(-4px)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:38px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0;color:var(--ink)}
.arrow svg{width:22px;height:26px;display:block;transition:transform .15s ease}
.arrow:hover{color:var(--red)}
.arrow.next:hover svg{transform:translateX(3px)}
.arrow.prev:hover svg{transform:translateX(-3px)}
.arrow.prev{left:calc(50% - var(--card-w) / 2 - 48px)}
.arrow.next{right:calc(50% - var(--card-w) / 2 - 48px)}
.card-art{aspect-ratio:4/3;display:grid;place-items:center;background:var(--tone)}
.card-art{overflow:hidden}
.card-art img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px;border-top:2px solid var(--ink);flex:1}
.card-title{font-family:var(--display);font-size:1.3rem;line-height:1.25;margin:0}
.card-desc{margin:0;font-size:.92rem;color:var(--ink-soft);line-height:1.5}
.pill{align-self:flex-start;margin-top:auto;font-family:var(--display);font-size:.85rem;padding:3px 12px;border-radius:999px;background:var(--ink);color:var(--paper)}
.pill.soon{background:none;color:var(--ink-soft);border:2px dashed var(--ink-soft)}

.empty{border:2px dashed var(--ink-soft);border-radius:22px;padding:28px 24px;color:var(--ink-soft);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.empty .dot{width:44px;height:44px;border-radius:50%;flex:none}

/* 테스트 화면 */
.test{padding:clamp(20px,4vw,48px) 0 clamp(40px,6vw,80px);border-top:2px solid var(--ink)}
.back{background:none;border:2px solid var(--ink);border-radius:999px;padding:8px 18px;font-family:var(--display)}
.back:hover{background:var(--ink);color:var(--paper)}
.test-box{margin-top:24px;display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(20px,4vw,48px);align-items:center;border:2px solid var(--ink);border-radius:26px;overflow:hidden;background:#fff}
.test-art{background:var(--tone);align-self:stretch;display:grid;place-items:center;padding:24px}
.test-art svg{width:86%;height:auto}
.test-frame{display:block;width:100%;height:760px;margin-top:20px;border:2px solid var(--ink);border-radius:22px;background:#fff}
.test-info{padding:28px clamp(18px,3vw,36px) 32px clamp(18px,3vw,8px)}
.test-info h2{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.2;margin:0 0 10px}
.test-info p{margin:0 0 18px;color:var(--ink-soft);max-width:28em}
.notice{display:inline-block;padding:10px 16px;border-radius:14px;background:#fff6cf;border:2px solid var(--yellow);color:var(--ink);font-size:.95rem}

footer{border-top:2px solid var(--ink);padding:22px 0 36px;color:var(--ink-soft);font-size:.9rem}
[hidden]{display:none !important}
@media (max-width:760px){
  .test-box{grid-template-columns:1fr}
  .test-info{padding:4px 20px 26px}
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .card.is-center:hover{transform:none}
}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <a class="brand" href="#home" aria-label="Wedding Project 처음으로">
      Wedding Project
    </a>
    <nav class="nav" aria-label="카테고리">
      <button type="button" data-go="cat-test">테스트</button>
      <button type="button" data-go="cat-2" data-soon>카테고리 2</button>
      <button type="button" data-go="cat-3" data-soon>카테고리 3</button>
    </nav>
  </header>

  <main id="view-home">
    <section class="hero">
      <h1>
        <span>이제 시작할</span>
        <span>당신의 결혼,</span>
        <span><span class="ask">안녕하신가요?</span></span>
      </h1>
    </section>

    <section class="cat" id="cat-test" aria-labelledby="cat-test-title">
      <div class="cat-head center">
        <h2 class="cat-title" id="cat-test-title">상대방과 나의 결혼에 대한 생각 test</h2>
      </div>
      <div class="slider-wrap">
        <button type="button" class="arrow prev" id="prev" aria-label="이전 테스트"><svg viewBox="0 0 22 26" aria-hidden="true"><path d="M19 3v20L3 13z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></button>
        <div class="slider" id="slider">
          <div class="track" id="track"></div>
        </div>
        <button type="button" class="arrow next" id="next" aria-label="다음 테스트"><svg viewBox="0 0 22 26" aria-hidden="true"><path d="M3 3v20l16-10z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></button>
      </div>
    </section>

    <section class="cat" id="cat-2" aria-labelledby="cat-2-title">
      <div class="cat-head"><h2 class="cat-title" id="cat-2-title"><span class="cat-no">2</span>카테고리 2</h2></div>
      <div class="empty"><span class="dot" style="background:var(--blue)"></span>준비 중입니다. 카테고리 이름과 내용을 정하면 이 자리에 들어갑니다.</div>
    </section>

    <section class="cat" id="cat-3" aria-labelledby="cat-3-title">
      <div class="cat-head"><h2 class="cat-title" id="cat-3-title"><span class="cat-no">3</span>카테고리 3</h2></div>
      <div class="empty"><span class="dot" style="background:var(--green)"></span>준비 중입니다. 카테고리 이름과 내용을 정하면 이 자리에 들어갑니다.</div>
    </section>
  </main>

  <main id="view-test" class="test" hidden>
    <button type="button" class="back" id="back">← 테스트 목록으로</button>
    <iframe class="test-frame" id="test-frame" title="테스트"></iframe>
  </main>

  <footer>Wedding Project</footer>
</div>

<script>
/* 테스트 목록: 여기에 항목을 추가하면 배너에 자동으로 들어갑니다. img 는 카드 그림, src 는 테스트 페이지 파일입니다. */
const TESTS = [
  { id:"majinoseon", title:"나의 결혼 마지노선 테스트", desc:"배우자의 어떤 행동만큼은 절대 받아들이기 어려울까요?", img:"test3/hero.png", src:"test3/", tone:"#FAF9F4" },
  { id:"values", title:"결혼 가치관 맞춰보기", desc:"우리, 결혼에 대해 같은 그림을 그리고 있을까?", img:"values/hero.jpg", src:"values/", tone:"#FFFFFF" }
];
const INTERVAL = 2000;

const artSvg = t => '<img src="' + t.img + '" alt="">';

const track = document.getElementById("track");
const slider = document.getElementById("slider");
function makeCard(t, clone){
  const a = document.createElement("a");
  a.className = "card";
  a.href = "#" + t.id;
  a.style.setProperty("--tone", t.tone);
  if (clone){ a.setAttribute("aria-hidden","true"); a.tabIndex = -1; }
  a.innerHTML = '<div class="card-art">' + artSvg(t) + '</div><div class="card-body"><h3 class="card-title"></h3><p class="card-desc"></p><span class="pill">테스트 하기</span></div>';
  a.querySelector(".card-title").textContent = t.title;
  a.querySelector(".card-desc").textContent = t.desc;
  return a;
}
/* 가운데 자리(C)에 첫 테스트가 오도록 두 벌을 이어 붙입니다 */
const C = 3, N = TESTS.length, OFFSET = (N - C % N) % N;
for (let i = 0; i < N * Math.ceil(8 / N); i++) track.appendChild(makeCard(TESTS[(i + OFFSET) % N], i >= N));

/* 가운데 카드 기준으로 왼쪽으로 한 장씩 넘어가는 무한 슬라이드 */
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const DUR = reduce ? 0 : 600;
const EASE = "transform " + DUR + "ms cubic-bezier(.6,0,.2,1)";
let busy = false, hover = false, userPaused = reduce, timer = null;
const cardW = () => track.firstElementChild.offsetWidth;
const stepWidth = () => cardW() + parseFloat(getComputedStyle(track).columnGap || 20);
const baseX = () => slider.clientWidth / 2 - C * stepWidth() - cardW() / 2;
const place = x => { track.style.transform = "translateX(" + x + "px)"; };
function setCenter(i){ [...track.children].forEach((el, k) => el.classList.toggle("is-center", k === i)); }

function slideNext(){
  if (busy) return; busy = true;
  setCenter(C + 1);
  track.style.transition = DUR ? EASE : "none";
  place(baseX() - stepWidth());
  setTimeout(() => {
    track.style.transition = "none";
    track.appendChild(track.firstElementChild);
    place(baseX());
    busy = false;
  }, DUR + 30);
}
function slidePrev(){
  if (busy) return; busy = true;
  track.style.transition = "none";
  track.insertBefore(track.lastElementChild, track.firstElementChild);
  place(baseX() - stepWidth());
  track.getBoundingClientRect();
  setCenter(C);
  track.style.transition = DUR ? EASE : "none";
  place(baseX());
  setTimeout(() => { busy = false; }, DUR + 30);
}
function settle(){ if (busy) return; track.style.transition = "none"; place(baseX()); }
setCenter(C); settle();
window.addEventListener("resize", settle);
window.addEventListener("load", settle);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(settle);
function tick(){
  const home = !document.getElementById("view-home").hidden;
  if (!userPaused && !hover && home && !document.hidden) slideNext();
}
timer = setInterval(tick, INTERVAL);

slider.addEventListener("mouseenter", () => hover = true);
slider.addEventListener("mouseleave", () => hover = false);
slider.addEventListener("focusin", () => hover = true);
slider.addEventListener("focusout", () => hover = false);
document.getElementById("next").addEventListener("click", slideNext);
document.getElementById("prev").addEventListener("click", slidePrev);

/* 화면 전환: 주소 끝의 #이름 으로 테스트를 엽니다 */
const viewHome = document.getElementById("view-home");
const viewTest = document.getElementById("view-test");
const frame = document.getElementById("test-frame");
let openId = null;
function route(){
  const id = (location.hash || "").replace("#", "");
  const t = TESTS.find(x => x.id === id);
  if (!t){
    viewHome.hidden = false; viewTest.hidden = true;
    if (openId){ frame.removeAttribute("src"); openId = null; }
    settle(); return;
  }
  viewHome.hidden = true; viewTest.hidden = false;
  if (openId !== t.id){ frame.style.height = "760px"; frame.title = t.title; frame.src = t.src; openId = t.id; }
  window.scrollTo(0, 0);
}
/* 테스트 내용 길이에 맞춰 틀 높이를 조절합니다 */
function fitFrame(){
  if (viewTest.hidden) return;
  try {
    const d = frame.contentDocument;
    if (!d || !d.body) return;
    const top = (d.defaultView && d.defaultView.scrollY) || 0;
    let h = 0;
    /* 화면 높이에 맞춰 늘어나는 바깥 상자는 빼고, 실제 내용(가장 안쪽 요소)의 끝만 잽니다 */
    for (const el of d.body.querySelectorAll("*")){
      if (el.firstElementChild || /^(SCRIPT|STYLE|TITLE|LINK|META)$/.test(el.tagName)) continue;
      const r = el.getBoundingClientRect(); if (r.height) h = Math.max(h, r.bottom + top);
    }
    h = Math.max(420, Math.ceil(h + 40));
    if (Math.abs(h - frame.offsetHeight) > 4) frame.style.height = h + "px";
  } catch (e) {}
}
setInterval(fitFrame, 300);
window.addEventListener("hashchange", route);
route();

document.getElementById("back").addEventListener("click", () => { location.hash = "home"; });
/* 상단 이름을 누르면 홈 화면 맨 위로 */
document.querySelector(".brand").addEventListener("click", e => {
  e.preventDefault();
  if (location.hash !== "#home") location.hash = "home";
  route();
  window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
});
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
  if (viewHome.hidden){ location.hash = "home"; viewHome.hidden = false; viewTest.hidden = true; }
  const el = document.getElementById(b.dataset.go);
  if (el) el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
}));
</script>
</body>
</html>
